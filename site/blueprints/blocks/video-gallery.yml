blueprint: page

name: gallerie vidéo
icon: video
preview: fields
wysiwyg: true
fields:
  video_list:
    type: structure
    label: list des videos YouTube
    fields:
      url:
        label: field.blocks.video.url.label
        type: url
        placeholder: field.blocks.video.url.placeholder
      toggle_ratio_1_1:
        width: 1/2
        label: Ratio 1/1
        type: toggle
        default: false
        text:
          - "non, vidéo horizontal"
          - "oui, vidéo carrée"
      info:
        type: info
        text: lien video YouTube
  caption:
    label: Légende
    type: writer
    inline: true
    marks:
      - link
      - bold
      - italic
      - underline
